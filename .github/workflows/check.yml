name: IPTV Source Checker

on:
  workflow_dispatch:
  push:
    paths:
      - 'live.txt'
      - 'check_iptv.py'
      - '.github/workflows/check.yml'
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间 02:00

concurrency:
  group: iptv-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史，rebase 需要

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show input stats
        run: |
          if [ -f live.txt ]; then
            total=$(grep -c '^http' live.txt || echo 0)
            echo "📥 输入文件共 $total 个链接"
            dupes=$(sort live.txt | grep '^http' | uniq -d | wc -l)
            echo "🔍 其中重复行: $dupes 个"
          else
            echo "❌ live.txt 不存在"
            exit 1
          fi

      - name: Run checker
        run: python check_iptv.py

      - name: Show output stats
        run: |
          echo "📤 生成文件统计:"
          for f in live_ok.txt live_fail.txt skipped.txt live_report.csv; do
            if [ -f "$f" ]; then
              lines=$(wc -l < "$f")
              size=$(du -sh "$f" | cut -f1)
              echo "   $f  → ${lines} 行, ${size}"
            else
              echo "   $f  → 未生成"
            fi
          done
          if [ -f live_ok.txt ]; then
            ok_count=$(grep -c '^http' live_ok.txt || echo 0)
            echo "✅ 可用去重后: $ok_count 个"
          fi
          if [ -f live_fail.txt ]; then
            fail_count=$(grep -c '^http' live_fail.txt || echo 0)
            echo "❌ 失效去重后: $fail_count 个"
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add live_ok.txt live_fail.txt skipped.txt live_report.csv

          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi

          git commit -m "chore: update IPTV check results [skip ci]"

          # 重试推送，解决并发冲突
          for i in 1 2 3; do
            echo "Push attempt $i..."
            git pull --rebase origin main
            if git push origin main; then
              echo "✅ 推送完成"
              exit 0
            fi
            echo "⚠️ 推送失败，等待重试..."
            sleep 5
          done

          echo "❌ 3 次推送均失败"
          exit 1
