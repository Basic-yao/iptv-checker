name: IPTV 检查器

on:
  push:
    paths:
      - 'live.txt'
      - 'check_iptv.py'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 显示输入统计
        run: |
          echo "📥 live.txt 行数: $(wc -l < live.txt)"
          echo "🔗 URL 数量: $(grep -c '^https\?://' live.txt || echo 0)"

      - name: 运行检查器（四档分档版）
        run: python check_iptv.py --threads 10 --timeout 20

      - name: 提交结果
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f live_ok.txt live_ok.m3u \
                     live_recent.txt live_month.txt live_3month.txt \
                     live_old.txt live_stale.txt \
                     live_fail.txt live_report.csv skipped.txt
          git commit --allow-empty -m "自动更新 IPTV 检查结果 [skip ci]" || true
          git push
