name: IPTV检查

on:
  schedule:
    - cron: '0 18 * * *'   # 北京时间 02:00
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'live.txt'
      - 'check_iptv.py'
      - '.github/workflows/check.yml'

concurrency:
  group: iptv-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Show input stats
        run: |
          if [ -f live.txt ]; then
            total=$(wc -l < live.txt)
            http_count=$(grep -c '^http' live.txt || echo 0)
            echo "📥 live.txt: ${total} 行, ${http_count} 个 http 链接"
          else
            echo "❌ live.txt 不存在"
            exit 1
          fi

      - name: Run checker
        id: checker
        run: |
          python check_iptv.py --threads 10 --timeout 10
        continue-on-error: false

      - name: Show output stats
        if: always()
        run: |
          echo "📤 生成文件统计:"
          for f in live_ok.txt live_fail.txt skipped.txt live_report.csv; do
            if [ -f "$f" ]; then
              lines=$(wc -l < "$f")
              size=$(du -sh "$f" | cut -f1)
              echo "   $f  → ${lines} 行, ${size}"
            else
              echo "   $f  → 未生成"
            fi
          done
          if [ -f live_ok.txt ]; then
            ok_count=$(grep -c '^http' live_ok.txt || echo 0)
            echo "✅ 可用去重后: $ok_count 个"
          fi
          if [ -f live_fail.txt ]; then
            fail_count=$(grep -c '^http' live_fail.txt || echo 0)
            echo "❌ 失效去重后: $fail_count 个"
          fi

      - name: Commit and push results
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 自动识别当前 HEAD 对应的远端分支，避免硬编码 main/master 失败
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "📌 当前分支: $BRANCH"

          git add live_ok.txt live_fail.txt skipped.txt live_report.csv

          if git diff --cached --quiet; then
            echo "📭 无变更，跳过提交"
            exit 0
          fi

          git commit -m "🔄 IPTV检测输出更新 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M') [skip ci]"

          # 推送前先同步远端，防止本地落后于 origin 导致 reject
          git fetch origin "$BRANCH"
          git pull --rebase origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH" || {
            echo "⚠️ 常规推送失败，尝试 force-with-lease..."
            git push --force-with-lease origin "HEAD:$BRANCH"
          }
