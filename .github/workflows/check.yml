name: IPTV Check

on:
  push:
    paths:
      - 'live.txt'
      - 'check_iptv.py'
      - '.github/workflows/check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run check
        env:
          TZ: Asia/Shanghai
        run: |
          python check_iptv.py --threads 10 --timeout 20

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f live_ok.txt live_ok.m3u live_fail.txt live_week.txt live_month.txt live_3month.txt live_old.txt live_stale.txt live_report.csv
          git commit --allow-empty -m "🔄 自动更新检测结果 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          git push
