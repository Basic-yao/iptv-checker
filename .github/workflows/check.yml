name: IPTV Source Checker

on:
  workflow_dispatch:
  push:
    paths:
      - 'live.txt'
      - 'check_iptv.py'
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间 02:00

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        run: python check_iptv.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add live_ok.m3u live_ok.txt live_fail.txt live_report.csv
          git diff --cached --quiet || git commit -m "chore: update IPTV check results [skip ci]"
          git push
