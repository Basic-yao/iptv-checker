name: IPTV 检查器

on:
  push:
    paths:
      - 'live.txt'
      - 'check_iptv.py'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 拉取上一次提交，用于对比新增源

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 显示输入统计
        run: |
          echo "📥 live.txt 行数: $(wc -l < live.txt)"
          echo "🔗 URL 数量: $(grep -c '^https\?://' live.txt || echo 0)"

      - name: 运行检查器
        continue-on-error: true   # ← 关键：脚本报非0退出也不中断
        run: python check_iptv.py --threads 10 --timeout 10

      - name: 提交结果
        continue-on-error: true   # ← 关键：无变化也不报错
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ 无变化，跳过提交"
          else
            git commit -m "自动更新 IPTV 检查结果 [skip ci]"
            git push
          fi
